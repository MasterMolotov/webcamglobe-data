name: Kameraliste aktualisieren

on:
  schedule:
    - cron: "0 3 * * 0" # sonntags
  workflow_dispatch:
    inputs:
      limit:
        description: "Höchstens so viele Kameras prüfen (leer = alle)"
        required: false
      type:
        description: "Nur diese Art prüfen, z. B. youtube (leer = alle)"
        required: false
      max_age:
        description: "Auch kürzlich geprüfte Kameras, 0 = alle (leer = älter als 24 Stunden)"
        required: false
      discover:
        description: "Neue Livestreams auf YouTube suchen (verbraucht fast das ganze Tageskontingent)"
        type: boolean
        default: false
      discover_set:
        description: "Welche Suche: general, traffic oder animals"
        required: false
        default: general
      import:
        description: "Quellen neu einlesen (setzt geprüfte Stream-Arten zurück)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    container: swift:6.1
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git jq libsqlite3-dev >/dev/null
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: Server/.build
          key: build-${{ hashFiles('Server/Package.resolved', 'Server/Sources/**', 'WebcamKit/Sources/**') }}
          restore-keys: build-
      - name: Bauen
        working-directory: Server
        run: swift build
      - name: Quellen einlesen
        if: ${{ inputs.import == true }}
        working-directory: Server
        env:
          DATABASE_PATH: ${{ github.workspace }}/webcams.sqlite
        run: .build/debug/WebcamServer import
      - name: YouTube durchsuchen
        if: ${{ inputs.discover == true }}
        working-directory: Server
        env:
          DATABASE_PATH: ${{ github.workspace }}/webcams.sqlite
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: .build/debug/WebcamServer discover --set "${{ inputs.discover_set || 'general' }}"
      - name: Suchergebnis sichern
        # Die Suche verbraucht das Tageskontingent, ihr Ergebnis darf nicht an der langen Prüfung hängen.
        if: ${{ inputs.discover == true }}
        env:
          DATABASE_PATH: ${{ github.workspace }}/webcams.sqlite
        run: |
          (cd Server && .build/debug/WebcamServer export --output "$RUNNER_TEMP/found.json")
          [ "$(jq length "$RUNNER_TEMP/found.json")" -ge "$(jq length webcams.json)" ] && mv "$RUNNER_TEMP/found.json" webcams.json
          sh .github/push.sh "YouTube-Suche übernommen"
      - name: Kameras prüfen
        working-directory: Server
        env:
          DATABASE_PATH: ${{ github.workspace }}/webcams.sqlite
          LIMIT: ${{ inputs.limit }}
          TYPE: ${{ inputs.type }}
          MAX_AGE: ${{ inputs.max_age }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Nach 4 Stunden abbrechen: Jede Prüfung ist schon gespeichert, der nächste Lauf macht weiter.
        run: timeout 14400 .build/debug/WebcamServer probe ${LIMIT:+--limit "$LIMIT"} ${TYPE:+--type "$TYPE"} ${MAX_AGE:+--max-age-hours "$MAX_AGE"} || [ $? -eq 124 ]
      - name: Exportieren
        working-directory: Server
        env:
          DATABASE_PATH: ${{ github.workspace }}/webcams.sqlite
        run: .build/debug/WebcamServer export --output "$RUNNER_TEMP/new.json"
      - name: Sicherung
        # GitHub kann von Kameraservern gesperrt werden. Dann lieber die alte Liste behalten.
        run: |
          live() { jq '[.[] | select(.streamType == "hls" or .streamType == "mjpeg" or .streamType == "youtube")] | length' "$1"; }
          old=$(jq length webcams.json); new=$(jq length "$RUNNER_TEMP/new.json")
          oldLive=$(live webcams.json); newLive=$(live "$RUNNER_TEMP/new.json")
          echo "Kameras $old -> $new, Livestreams $oldLive -> $newLive"
          [ $((new * 100)) -ge $((old * 85)) ] && [ $((newLive * 100)) -ge $((oldLive * 85)) ] || { echo "Zu viele Kameras verschwunden, Liste bleibt unverändert"; exit 1; }
          mv "$RUNNER_TEMP/new.json" webcams.json
      - name: Hochladen
        run: sh .github/push.sh "Kameraliste aktualisiert"
